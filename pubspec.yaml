name: orlux
description: Offline Android watch — UTC plus your timezone, stopwatches, countdowns, and alarms.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  url_launcher: ^6.3.1
  file_picker: ^11.0.2
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  flutter_timezone: ^4.1.0
  flutter_secure_storage: ^10.3.1
  encrypt: ^5.0.3
  crypto: ^3.0.7
  wakelock_plus: ^1.3.2
  audioplayers: ^6.5.1
  path_provider: ^2.1.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
